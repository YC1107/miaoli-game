<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拆歌遊戲</title>
<style>
  :root { --ink:#222; --muted:#666; --line:#ddd; --bg:#f5f5f5; --panel:#fff; --accent:#315b78; --accent2:#e9f0f4; --danger:#a33; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:16px 20px; }
  header h1 { margin:0; font-size:1.35rem; font-weight:700; }
  header p { margin:4px 0 0; color:var(--muted); font-size:.92rem; }
  main { max-width:980px; margin:0 auto; padding:18px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  button, .button { border:1px solid #c9c9c9; background:#fff; color:var(--ink); border-radius:8px; padding:10px 14px; font:inherit; cursor:pointer; }
  button:hover, .button:hover { background:#f0f0f0; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { background:#25475f; }
  button.danger { color:var(--danger); border-color:#d7bcbc; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tab.active { background:var(--accent2); border-color:var(--accent); color:var(--accent); font-weight:700; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  h2 { margin:0 0 14px; font-size:1.12rem; }
  h3 { margin:0 0 8px; font-size:1rem; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  label { display:block; font-weight:600; font-size:.92rem; margin-bottom:5px; }
  input, select, textarea { width:100%; border:1px solid #cfcfcf; border-radius:8px; padding:10px; font:inherit; background:#fff; color:var(--ink); }
  textarea { min-height:90px; resize:vertical; }
  input[type=file] { padding:8px; }
  .field { min-width:0; }
  .full { grid-column:1/-1; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:.9rem; }
  .hidden { display:none !important; }
  .question-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .question-item { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:8px; }
  .question-item .info { min-width:0; }
  .question-item strong { display:block; overflow-wrap:anywhere; }
  .tag { display:inline-block; padding:2px 7px; border-radius:5px; background:#eee; color:#444; font-size:.8rem; margin-right:5px; }
  .game-card { text-align:center; padding:24px 12px; }
  .game-card .count { color:var(--muted); margin-bottom:8px; }
  .game-card .type { display:inline-block; background:var(--accent2); color:var(--accent); padding:4px 10px; border-radius:6px; margin-bottom:14px; font-size:.9rem; }
  .game-card .prompt { font-size:clamp(1.2rem,3vw,1.7rem); font-weight:700; margin:8px auto 18px; overflow-wrap:anywhere; }
  .answer-box { margin:18px auto; max-width:600px; padding:14px; border:1px dashed #aaa; border-radius:8px; background:#fafafa; }
  .answer-box h3 { font-size:1.2rem; }
  audio { width:100%; max-width:560px; margin:10px auto; display:block; }
  .notice { background:#f8f6e9; border:1px solid #e5ddb2; padding:10px 12px; border-radius:8px; font-size:.9rem; }
  .empty { padding:22px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:8px; }
  .right { margin-left:auto; }
  @media (max-width:640px) {
    main { padding:12px; }
    header { padding:14px 12px; }
    .grid { grid-template-columns:1fr; }
    .question-item { align-items:flex-start; }
    .question-item .row { flex-direction:column; align-items:stretch; }
    .tabs button { flex:1; padding:10px 6px; }
    .panel { padding:14px; }
  }
</style>
</head>
<body>
<header>
  <h1>拆歌遊戲</h1>
  <p>簡單題庫管理・前奏猜歌・念歌詞猜歌</p>
</header>
<main>
  <div class="tabs">
    <button class="tab active" data-tab="game">開始遊戲</button>
    <button class="tab" data-tab="bank">題庫管理</button>
    <button class="tab" data-tab="backup">備份／還原</button>
  </div>

  <section id="game" class="tab-pane">
    <div class="panel">
      <div class="grid">
        <div class="field">
          <label for="gameType">選擇題型</label>
          <select id="gameType">
            <option value="all">全部題型</option>
            <option value="intro">播放前奏猜歌</option>
            <option value="lyrics">念歌詞猜歌</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="startGame">開始／套用篩選</button>
        <span id="gameTotal" class="muted"></span>
      </div>
    </div>
    <div class="panel game-card" id="gamePanel">
      <div class="empty">先在「題庫管理」新增題目，再開始遊戲。</div>
    </div>
    <div class="row" style="justify-content:space-between">
      <button id="prevQuestion" disabled>← 上一題</button>
      <button id="nextQuestion" disabled>下一題 →</button>
    </div>
  </section>

  <section id="bank" class="tab-pane hidden">
    <div class="panel">
      <h2 id="formTitle">新增題目</h2>
      <form id="questionForm">
        <input type="hidden" id="editId">
        <div class="grid">
          <div class="field full">
            <label for="type">題型 *</label>
            <select id="type" required>
              <option value="intro">播放前奏猜歌</option>
              <option value="lyrics">念歌詞猜歌</option>
            </select>
          </div>
          <div class="field">
            <label for="singer">歌手</label>
            <input id="singer" placeholder="輸入歌手">
          </div>
          <div class="field">
            <label for="song">歌曲 *</label>
            <input id="song" required placeholder="輸入歌曲名稱">
          </div>
          <div class="field">
            <label for="year">年代</label>
            <input id="year" placeholder="例如：2000 年代">
          </div>
          <div class="field">
            <label for="difficulty">難度</label>
            <select id="difficulty">
              <option>普通</option><option>簡單</option><option>困難</option>
            </select>
          </div>
          <div class="field full hidden" id="lyricsField">
            <label for="lyrics">歌詞文字（選填）</label>
            <textarea id="lyrics" placeholder="輸入要顯示給玩家的歌詞"></textarea>
          </div>
          <div class="field full">
            <label for="audioFile">音檔（MP3、M4A、WAV 等）</label>
            <input id="audioFile" type="file" accept="audio/*">
            <div class="muted" id="audioStatus">尚未選擇音檔。編輯題目時可保留原音檔。</div>
          </div>
        </div>
        <div class="row" style="margin-top:16px">
          <button type="submit" class="primary" id="saveQuestion">儲存題目</button>
          <button type="button" id="resetForm">清空表單</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <div class="row">
        <h2 style="margin:0">現有題庫</h2>
        <span class="muted right" id="bankCount">0 題</span>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="searchText">搜尋歌曲／歌手／年代</label>
        <input id="searchText" placeholder="輸入關鍵字">
      </div>
      <div id="questionList" class="question-list"></div>
    </div>
  </section>

  <section id="backup" class="tab-pane hidden">
    <div class="panel">
      <h2>題庫備份與還原</h2>
      <p>題目和音檔保存在目前這個瀏覽器中。建議定期匯出備份；換手機、換電腦或清除瀏覽器資料時，可用備份檔還原。</p>
      <div class="row">
        <button class="primary" id="exportBackup">匯出題庫備份（含音檔）</button>
        <label class="button" for="importFile">匯入備份檔</label>
        <input id="importFile" class="hidden" type="file" accept="application/json,.json">
      </div>
      <p class="muted">匯入會將備份中的題目加入目前題庫；若 ID 相同則更新該題。</p>
      <div class="notice">此版本不需要登入，但題庫不會自動在手機與電腦之間同步。要在另一台裝置使用，請先匯出備份，再於另一台裝置匯入。</div>
      <p id="backupStatus" class="muted" aria-live="polite"></p>
    </div>
  </section>
</main>
<script>
(() => {
  const DB_NAME = '拆歌遊戲資料庫';
  const STORE = 'questions';
  let db;
  let questions = [];
  let gameQuestions = [];
  let gameIndex = 0;
  let currentAudioUrl = null;
  let editingAudioKept = false;

  const $ = id => document.getElementById(id);
  const typeName = type => type === 'lyrics' ? '念歌詞猜歌' : '播放前奏猜歌';
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function allQuestions() {
    return new Promise((resolve, reject) => {
      const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }
  function putQuestion(q) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(q);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  function deleteQuestion(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  async function refresh() {
    questions = (await allQuestions()).sort((a,b) => (a.order || 0) - (b.order || 0) || a.createdAt - b.createdAt);
    renderLists();
    renderGame();
  }
  function renderLists() {
    $('bankCount').textContent = `${questions.length} 題`;
    const search = $('searchText').value.trim().toLowerCase();
    const list = questions.filter(q =>
      (!search || [q.prompt,q.song,q.singer,q.year,q.lyrics].some(v => (v || '').toLowerCase().includes(search))));
    const root = $('questionList'); root.innerHTML = '';
    if (!list.length) {
      root.innerHTML = '<div class="empty">目前沒有符合條件的題目。</div>'; return;
    }
    list.forEach((q, idx) => {
      const item = document.createElement('div'); item.className = 'question-item';
      const info = document.createElement('div'); info.className = 'info';
      info.innerHTML = `<span class="tag">${typeName(q.type)}</span><strong>${escapeHtml(q.singer ? q.singer + '－' : '')}${escapeHtml(q.song || '未命名歌曲')}</strong><span class="muted">${escapeHtml(q.year || '年代未填')} · ${escapeHtml(q.difficulty || '普通')} · ${q.audio ? '已附音檔' : '無音檔'}</span>`;
      const actions = document.createElement('div'); actions.className = 'row';
      const edit = document.createElement('button'); edit.textContent = '編輯'; edit.onclick = () => loadForm(q);
      const up = document.createElement('button'); up.textContent = '↑'; up.title = '往前移'; up.disabled = idx === 0; up.onclick = () => moveQuestion(q, -1, list);
      const down = document.createElement('button'); down.textContent = '↓'; down.title = '往後移'; down.disabled = idx === list.length - 1; down.onclick = () => moveQuestion(q, 1, list);
      const del = document.createElement('button'); del.textContent = '刪除'; del.className = 'danger'; del.onclick = async () => {
        if (confirm(`確定刪除「${q.song}」這題？`)) { await deleteQuestion(q.id); await refresh(); }
      };
      actions.append(edit, up, down, del); item.append(info, actions); root.appendChild(item);
    });
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  async function moveQuestion(q, dir, visibleList) {
    const i = visibleList.findIndex(x => x.id === q.id), j = i + dir;
    if (j < 0 || j >= visibleList.length) return;
    const a = visibleList[i], b = visibleList[j];
    const temp = a.order || 0; a.order = b.order || 0; b.order = temp;
    // Keep ordering stable even for questions created before order values existed.
    const all = [...questions];
    all.forEach((x,k) => { if (x.id === a.id) x.order = j; else if (x.id === b.id) x.order = i; else if (x.order == null) x.order = k + 1000; });
    await Promise.all([putQuestion(a), putQuestion(b)]);
    await refresh();
  }
  function resetForm() {
    $('questionForm').reset(); $('editId').value = ''; $('formTitle').textContent = '新增題目';
    $('audioStatus').textContent = '尚未選擇音檔。編輯題目時可保留原音檔。';
    editingAudioKept = false; $('saveQuestion').textContent = '儲存題目';
  }
  function loadForm(q) {
    $('editId').value = q.id; $('type').value = q.type;
    $('lyrics').value = q.lyrics || '';
    $('song').value = q.song || ''; $('singer').value = q.singer || '';
    $('year').value = q.year || ''; $('difficulty').value = q.difficulty || '普通';
    $('audioFile').value = ''; editingAudioKept = !!q.audio;
    $('audioStatus').textContent = q.audio ? '已保留原音檔；若要更換，請選擇新檔案。' : '這題目前沒有音檔。';
    $('formTitle').textContent = '編輯題目'; $('saveQuestion').textContent = '儲存修改';
    showTab('bank'); window.scrollTo({top:0,behavior:'smooth'});
  }
  $('questionForm').addEventListener('submit', async e => {
    e.preventDefault();
    const id = $('editId').value || uid();
    const old = questions.find(q => q.id === id);
    const file = $('audioFile').files[0];
    const q = {
      id, type: $('type').value,
      prompt: $('type').value === 'lyrics' ? '聽歌詞猜歌名！' : '聽前奏猜歌名！',
      lyrics: $('lyrics').value.trim(), song: $('song').value.trim(),
      singer: $('singer').value.trim(), year: $('year').value.trim(),
      difficulty: $('difficulty').value,
      audio: file ? file : (old ? old.audio : null),
      createdAt: old ? old.createdAt : Date.now(), order: old ? old.order : questions.length
    };
    try {
      await putQuestion(q); resetForm(); await refresh();
      $('backupStatus').textContent = '';
      alert('題目已儲存。');
    } catch(err) { alert('儲存失敗，可能是音檔太大或瀏覽器儲存空間不足。'); }
  });
  $('resetForm').onclick = resetForm;
  $('searchText').addEventListener('input', renderLists);

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-pane').forEach(s => s.classList.toggle('hidden', s.id !== name));
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.tab));

  $('startGame').onclick = () => {
    const type = $('gameType').value;
    gameQuestions = questions.filter(q => type === 'all' || q.type === type);
    gameIndex = 0; renderGame();
  };
  $('prevQuestion').onclick = () => { if (gameIndex > 0) { gameIndex--; renderGame(); } };
  $('nextQuestion').onclick = () => { if (gameIndex < gameQuestions.length - 1) { gameIndex++; renderGame(); } };
  function renderGame() {
    const root = $('gamePanel');
    $('gameTotal').textContent = `${gameQuestions.length} 題可玩`;
    $('prevQuestion').disabled = !gameQuestions.length || gameIndex <= 0;
    $('nextQuestion').disabled = !gameQuestions.length || gameIndex >= gameQuestions.length - 1;
    if (!gameQuestions.length) {
      root.innerHTML = `<div class="empty">${questions.length ? '目前篩選條件沒有題目，請更換關卡或題型。' : '先在「題庫管理」新增題目，再開始遊戲。'}</div>`;
      return;
    }
    const q = gameQuestions[gameIndex];
    if (currentAudioUrl) { URL.revokeObjectURL(currentAudioUrl); currentAudioUrl = null; }
    root.innerHTML = '';
    const count = document.createElement('div'); count.className = 'count'; count.textContent = `第 ${gameIndex+1} 題／共 ${gameQuestions.length} 題`;
    const type = document.createElement('div'); type.className = 'type'; type.textContent = typeName(q.type);
    const prompt = document.createElement('div'); prompt.className = 'prompt'; prompt.textContent = q.prompt || (q.type === 'lyrics' ? '聽歌詞猜歌名！' : '聽前奏猜歌名！');
    root.append(count, type, prompt);
    if (q.type === 'lyrics' && q.lyrics) {
      const lyricsBtn = document.createElement('button'); lyricsBtn.textContent = '顯示歌詞'; lyricsBtn.onclick = () => {
        const box = root.querySelector('.lyrics-box');
        if (box) { box.classList.toggle('hidden'); lyricsBtn.textContent = box.classList.contains('hidden') ? '顯示歌詞' : '隱藏歌詞'; }
      };
      const lyrics = document.createElement('div'); lyrics.className = 'answer-box lyrics-box hidden'; lyrics.textContent = q.lyrics;
      root.append(lyricsBtn, lyrics);
    }
    if (q.audio) {
      const audio = document.createElement('audio'); audio.controls = true; audio.preload = 'metadata';
      currentAudioUrl = URL.createObjectURL(q.audio); audio.src = currentAudioUrl; root.appendChild(audio);
    } else {
      const noAudio = document.createElement('p'); noAudio.className = 'muted'; noAudio.textContent = '這題尚未上傳音檔。'; root.appendChild(noAudio);
    }
    const answerBtn = document.createElement('button'); answerBtn.className = 'primary'; answerBtn.textContent = '揭曉答案';
    const answer = document.createElement('div'); answer.className = 'answer-box hidden';
    const title = document.createElement('h3'); title.textContent = q.song;
    const singer = document.createElement('p'); singer.textContent = q.singer ? `歌手：${q.singer}` : '';
    const year = document.createElement('p'); year.textContent = q.year ? `年代：${q.year}` : '';
    answer.append(title, singer, year);

    answerBtn.onclick = () => { answer.classList.toggle('hidden'); answerBtn.textContent = answer.classList.contains('hidden') ? '揭曉答案' : '隱藏答案'; };
    root.append(answerBtn, answer);
  }

  $('exportBackup').onclick = async () => {
    try {
      const data = await allQuestions();
      const encoded = await Promise.all(data.map(async q => {
        const copy = {...q};
        if (q.audio) copy.audioData = await blobToDataURL(q.audio);
        delete copy.audio;
        return copy;
      }));
      const blob = new Blob([JSON.stringify({format:'拆歌遊戲備份',version:1,exportedAt:new Date().toISOString(),questions:encoded})], {type:'application/json'});
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `拆歌遊戲備份-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
      $('backupStatus').textContent = `已匯出 ${data.length} 題。請妥善保存備份檔。`;
    } catch(err) { $('backupStatus').textContent = '匯出失敗，可能是音檔總容量太大。'; }
  };
  function blobToDataURL(blob) {
    return new Promise((resolve,reject) => {
      const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob);
    });
  }
  function dataURLToBlob(dataUrl) {
    const [meta, data] = dataUrl.split(',');
    const mime = (meta.match(/data:(.*?);base64/) || [,'application/octet-stream'])[1];
    const binary = atob(data); const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], {type:mime});
  }
  $('importFile').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const backup = JSON.parse(await file.text());
      if (!Array.isArray(backup.questions)) throw new Error('格式不正確');
      let count = 0;
      for (const item of backup.questions) {
        const q = {...item};
        if (q.audioData) { q.audio = dataURLToBlob(q.audioData); delete q.audioData; }
        else q.audio = null;
        if (!q.id) q.id = uid();
        await putQuestion(q); count++;
      }
      await refresh();
      $('backupStatus').textContent = `已匯入 ${count} 題。`;
      alert(`匯入完成，共處理 ${count} 題。`);
    } catch(err) {
      $('backupStatus').textContent = '匯入失敗：請確認選擇的是本頁匯出的 JSON 備份檔。';
      alert('匯入失敗，請確認備份檔格式正確。');
    } finally { e.target.value = ''; }
  });

  $('type').addEventListener('change', () => {
    $('lyricsField').classList.toggle('hidden', $('type').value !== 'lyrics');
  });

  (async () => {
    try {
      db = await openDB();
      await refresh();
    } catch (err) {
      $('gamePanel').innerHTML = '<div class="empty">此瀏覽器無法使用本機資料庫，請改用最新版 Chrome、Edge 或 Safari 開啟。</div>';
    }
  })();
})();
</script>
</body>
</html>
